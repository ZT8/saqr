# Builds Around.ipa on GitHub's macOS runner.
# - Without signing secrets: an UNSIGNED ipa (sign it with Sideloadly / AltStore).
# - With the secrets below: a signed ipa.
name: Around iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [around-app]
    paths: ['mobile/**', '.github/workflows/ios.yml']

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      API_URL: ${{ secrets.API_URL }}
      BUNDLE_ID_SECRET: ${{ secrets.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
      EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
      CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the iOS project
        run: |
          flutter create --org ae.around --project-name around --platforms=ios .
          rm -f test/widget_test.dart
          BUNDLE_ID="${BUNDLE_ID_SECRET:-ae.around.app}"
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string نحتاج موقعك عشان الفرع يجهّز طلبك ويعرف متى توصل." $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Around" $PLIST || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Around" $PLIST
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = ae.around.around;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" ios/Runner.xcodeproj/project.pbxproj

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build unsigned ipa
        if: env.CERT_P12_BASE64 == ''
        run: |
          flutter build ios --release --no-codesign --dart-define=API_URL=${API_URL:-https://example.invalid}
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          mkdir -p build/ipa && zip -qr build/ipa/Around-unsigned.ipa Payload

      - name: Import signing certificate and profile
        if: env.CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/around.mobileprovision"

      - name: Build signed ipa
        if: env.CERT_P12_BASE64 != ''
        run: |
          flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD:-app-store}</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath $RUNNER_TEMP/Around.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="iPhone Distribution"
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Around.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath build/ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Around-ipa
          path: mobile/build/ipa/*.ipa
