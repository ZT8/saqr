name: Mobile builds (IPA + APK)
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['mobile/**']

jobs:
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: chmod +x setup.sh && ./setup.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr saqr-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: saqr-ios-unsigned-ipa, path: mobile/saqr-unsigned.ipa }

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: chmod +x setup.sh && ./setup.sh
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: saqr-android-apk, path: mobile/build/app/outputs/flutter-apk/app-release.apk }

  publish:
    needs: [ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Attach to the "mobile-latest" release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete mobile-latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create mobile-latest -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Saqr mobile (latest build)" --notes "Built from $GITHUB_SHA. The IPA is unsigned: sign it (Sideloadly, AltStore or your certificate) before installing." \
            out/saqr-unsigned.ipa out/app-release.apk
      - name: Store builds on the "builds" branch
        run: |
          git init -q b && cd b && git checkout -q -b builds
          cp ../out/saqr-unsigned.ipa ../out/app-release.apk .
          git -c user.name=ci -c user.email=ci@saqr.local add . && git -c user.name=ci -c user.email=ci@saqr.local commit -qm "Builds for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" builds
