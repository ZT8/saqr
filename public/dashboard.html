<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صقر | لوحة الجهات المختصة</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app">
  <svg width="0" height="0" aria-hidden="true" class="defs">
    <defs>
      <clipPath id="eyeClip" clipPathUnits="objectBoundingBox"><path d="M0 .5C.24 -.12 .76 -.12 1 .5C.76 1.12 .24 1.12 0 .5Z"/></clipPath>
      <symbol id="eye" viewBox="0 0 100 60"><path d="M0 30C24 -6 76 -6 100 30C76 66 24 66 0 30Z"/></symbol>
    </defs>
  </svg>

  <section id="loginView" hidden>
    <form class="card form login-box" id="loginForm">
      <a class="mark" href="/"><svg class="mark-eye" viewBox="0 0 100 60" aria-hidden="true"><use href="#eye"/><circle cx="54" cy="30" r="13" class="mark-iris"/></svg><span data-i18n="brand"></span></a>
      <h1 data-i18n="login_title"></h1>
      <label><span data-i18n="username"></span><input name="username" autocomplete="username" required dir="ltr"></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="btn-primary" type="submit" data-i18n="login"></button>
    </form>
  </section>

  <div class="app-shell" id="dashView" hidden>
    <aside class="side">
      <a class="mark" href="/"><svg class="mark-eye" viewBox="0 0 100 60" aria-hidden="true"><use href="#eye"/><circle cx="54" cy="30" r="13" class="mark-iris"/></svg><span data-i18n="brand"></span></a>
      <nav class="side-nav" aria-label="dashboard">
        <a href="#overview" data-view="overview"><span data-i18n="nav_overview"></span></a>
        <a href="#radar" data-view="radar"><span data-i18n="radar_title"></span><span class="n" id="nRadar"></span></a>
        <a href="#queue" data-view="queue"><span data-i18n="queue"></span><span class="n" id="nQueue"></span></a>
        <a href="#cases" data-view="cases"><span data-i18n="cases_title"></span><span class="n" id="nCases"></span></a>
        <a href="#system" data-view="system"><span data-i18n="nav_system"></span></a>
      </nav>
      <p class="side-foot" data-i18n="foot_demo_short"></p>
    </aside>

    <header class="top">
      <h1 id="viewTitle"></h1>
      <a class="btn-primary" id="exportBtn" href="/api/admin/export.csv?status=verified" data-i18n="export_csv"></a>
      <span class="user" id="whoami"></span>
      <button class="btn-ghost btn-sm" id="logoutBtn" type="button" data-i18n="logout"></button>
      <button class="lang" id="langBtn" type="button" data-i18n="lang_toggle"></button>
    </header>

    <main class="sheet">
      <!-- Overview: "Is fraud rising, and what needs a decision?" -->
      <section data-screen="overview">
        <div class="sheet-head"><div><h2 data-i18n="nav_overview"></h2><p id="finding"></p></div></div>
        <div class="kpis" id="kpis"></div>
        <div class="panels">
          <div class="panel"><h3 data-i18n="ch_trend"></h3><div id="trendChart"></div></div>
          <div class="panel"><h3 data-i18n="ch_scans"></h3><div id="scanChart"></div></div>
        </div>
        <div class="panels-3">
          <div class="panel"><h3 data-i18n="ch_category"></h3><div class="hbars" id="byCategory"></div></div>
          <div class="panel"><h3 data-i18n="ch_emirate"></h3><div class="hbars" id="byEmirate"></div></div>
          <div class="panel"><h3 data-i18n="ch_channel"></h3><div class="hbars" id="byChannel"></div></div>
        </div>
      </section>

      <!-- Campaign radar -->
      <section data-screen="radar" hidden>
        <div class="sheet-head"><div><h2 data-i18n="radar_title"></h2><p data-i18n="radar_sub"></p></div></div>
        <div class="campaigns" id="campaigns"></div>
      </section>

      <!-- Review queue -->
      <section data-screen="queue" hidden>
        <div class="sheet-head"><div><h2 data-i18n="queue"></h2><p data-i18n="export_hint"></p></div></div>
        <div class="queue-bar">
          <div class="tabs" role="tablist" id="statusTabs">
            <button role="tab" data-status="pending" aria-selected="true" data-i18n="tab_pending"></button>
            <button role="tab" data-status="verified" aria-selected="false" data-i18n="tab_verified"></button>
            <button role="tab" data-status="rejected" aria-selected="false" data-i18n="tab_rejected"></button>
          </div>
          <select id="qType" aria-label="type">
            <option value="" data-i18n="all_types"></option>
            <option value="url" data-i18n="t_url"></option>
            <option value="phone" data-i18n="t_phone"></option>
            <option value="message" data-i18n="t_message"></option>
          </select>
          <input type="search" id="qSearch" data-i18n-ph="search_ph" dir="auto" aria-label="search">
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th data-i18n="col_indicator"></th><th data-i18n="col_category"></th><th data-i18n="col_reports"></th>
              <th data-i18n="col_score"></th><th data-i18n="col_last"></th><th data-i18n="col_actions"></th>
            </tr></thead>
            <tbody id="queueBody"></tbody>
          </table>
        </div>
        <div class="pager" id="qPager"></div>
      </section>

      <!-- Extortion cases: inbox triage -->
      <section data-screen="cases" hidden>
        <div class="sheet-head">
          <div><h2 data-i18n="cases_title"></h2></div>
          <div class="tabs" role="tablist" id="caseStatusTabs">
            <button role="tab" data-cs="" aria-selected="true" data-i18n="all"></button>
            <button role="tab" data-cs="new" aria-selected="false" data-i18n="cs_new"></button>
            <button role="tab" data-cs="in_progress" aria-selected="false" data-i18n="cs_in_progress"></button>
            <button role="tab" data-cs="closed" aria-selected="false" data-i18n="cs_closed"></button>
          </div>
        </div>
        <div class="cases-grid">
          <ul class="case-list" id="caseList"></ul>
          <div class="case-detail" id="caseDetail"></div>
        </div>
      </section>

      <!-- Model and audit -->
      <section data-screen="system" hidden>
        <div class="sheet-head"><div><h2 data-i18n="nav_system"></h2></div></div>
        <div class="side-grid">
          <div class="panel model">
            <h3 data-i18n="model_title"></h3>
            <dl id="modelInfo"></dl>
            <p data-i18n="model_note"></p>
          </div>
          <div class="panel">
            <h3 data-i18n="audit_title"></h3>
            <ul class="audit" id="audit"></ul>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
